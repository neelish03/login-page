<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loginpage/in.css">
</head>
<body>
<div class="stage">
  <img src="apo.jpg" alt="" class="bg-photo">
  <div class="bg-shade"></div>

  <svg class="herb herb-top" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M60 200 C60 140 40 120 60 60 C80 120 60 140 60 200" fill="none" stroke="#7a9471" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="10" ry="18" fill="#8fab7f" transform="rotate(-25 60 90)"/>
    <ellipse cx="60" cy="70" rx="9" ry="16" fill="#7a9471" transform="rotate(20 60 70)"/>
    <ellipse cx="60" cy="110" rx="9" ry="16" fill="#7a9471" transform="rotate(-35 60 110)"/>
  </svg>

  <div class="greeting">
    <p class="eyebrow">The Apothecary Diaries</p>
    <h1>Welcome</h1>
    <p>Sign in to tend your remedies.</p>

    <div class="social-rail" aria-label="Follow us">

      </a>
      <a href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.68 0H1.32C.59 0 0 .59 0 1.32v21.36C0 23.4.59 24 1.32 24h11.5v-9.29H9.69v-3.62h3.13V8.41c0-3.1 1.89-4.79 4.66-4.79 1.32 0 2.46.1 2.79.14v3.24h-1.92c-1.5 0-1.8.72-1.8 1.76v2.31h3.59l-.47 3.62h-3.12V24h6.12c.73 0 1.32-.6 1.32-1.32V1.32C24 .59 23.41 0 22.68 0z"/></svg>

      </a>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="card-motif" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#c9a66b" stroke-width="1.2"/>
          <path d="M8 13 Q12 9 16 13" fill="none" stroke="#c9a66b" stroke-width="1.2"/>
          <circle cx="12" cy="8.5" r="1.3" fill="#c9a66b"/>
        </svg>
      </div>

      <form action="" method="post">
        <p class="form-title">Enter the Ledger</p>
        <div class="field">
          <label for="li-user">Username or email</label>
          <input id="li-user" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="li-pass">Password</label>
          <input id="li-pass" name="password" type="password" placeholder="" autocomplete="current-password" required>
        </div>
        <div class="row-between">
          <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="submit">Sign in</button>

        <div class="footer">
          <div class="b">
            <p> Don't have an account? </p>
          </div>
          <a href="#">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
